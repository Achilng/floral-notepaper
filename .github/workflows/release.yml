          path: release-assets

      - name: Download signed MSIX (AArch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-msix-aarch64
          path: release-assets

      - name: Download public MSIX signing certificate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: msix-signing-certificate
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-release-assets
          path: release-assets

      - name: Download macOS Intel release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-x64-release-asset
          path: release-assets

      - name: Download macOS Apple Silicon release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-aarch64-release-asset
          path: release-assets

      - name: Validate release assets and generate checksums
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          required_assets=(
            "floral-notepaper_${RELEASE_VERSION}.exe"
            "floral-notepaper_${RELEASE_VERSION}_x64-setup.exe"
            "floral-notepaper_${RELEASE_VERSION}_aarch64-setup.exe"
            "floral-notepaper_${RELEASE_VERSION}_x64.msix"
            "floral-notepaper_${RELEASE_VERSION}_aarch64.msix"
            "floral-notepaper_${RELEASE_VERSION}_msix.cer"
            "floral-notepaper_${RELEASE_VERSION}_amd64.deb"
            "floral-notepaper-${RELEASE_VERSION}-1.x86_64.rpm"
            "floral-notepaper_${RELEASE_VERSION}_amd64.AppImage"
            "floral-notepaper_${RELEASE_VERSION}_x64.dmg"
            "floral-notepaper_${RELEASE_VERSION}_aarch64.dmg"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done

          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$RELEASE_COMMIT"
            echo "workflow_run_id=$WORKFLOW_RUN_ID"
            echo "workflow_run_attempt=$WORKFLOW_RUN_ATTEMPT"
          } > release-assets/BUILD-INFO.txt

          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' \
            > release-assets/SHA256SUMS.txt

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail

          bash scripts/verify-release-tag.sh \
            --commit "$RELEASE_COMMIT" \
            --tag "$RELEASE_TAG" \
            --context "publishing"

          release_note_file="Docs/release-note/${RELEASE_VERSION}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published and will not be overwritten." >&2
              exit 1
            fi

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file "$release_note_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file "$release_note_file" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  upload-to-existing-release:
    name: Upload artifacts to existing release
    if: inputs.rebuild == true
    needs:
      - validate-release
      - sign-and-verify-windows-installer
      - sign-and-verify-windows-installer-aarch64
      - sign-windows-msix
      - verify-windows-msix-install
      - build-linux
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Apply Rebuild source overlay
        if: inputs.rebuild == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rebuild-source-overlay
          path: .

      - name: Revalidate release tag
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          bash scripts/verify-release-tag.sh \
            --commit "$RELEASE_COMMIT" \
            --tag "$RELEASE_TAG" \
            --context "uploading"

      - name: Revalidate existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "Release $RELEASE_TAG no longer exists; aborting." >&2
            exit 1
          fi
          if [[ "$is_draft" != "false" ]]; then
            echo "Release $RELEASE_TAG is no longer published; aborting." >&2
            exit 1
          fi

      - name: Download signed Windows portable executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-portable
          path: release-assets

      - name: Download signed Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-installer
          path: release-assets

      - name: Download signed Windows AArch64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-installer-arm64
          path: release-assets

      - name: Download signed MSIX (x64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-msix-x64
          path: release-assets

      - name: Download signed MSIX (AArch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-windows-msix-aarch64
          path: release-assets

      - name: Download public MSIX signing certificate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: msix-signing-certificate
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-release-assets
          path: release-assets

      - name: Download macOS Intel release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-x64-release-asset
          path: release-assets

      - name: Download macOS Apple Silicon release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-aarch64-release-asset
          path: release-assets

      - name: Validate release assets and generate checksums
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          required_assets=(
            "floral-notepaper_${RELEASE_VERSION}.exe"
            "floral-notepaper_${RELEASE_VERSION}_x64-setup.exe"
            "floral-notepaper_${RELEASE_VERSION}_aarch64-setup.exe"
            "floral-notepaper_${RELEASE_VERSION}_x64.msix"
            "floral-notepaper_${RELEASE_VERSION}_aarch64.msix"
            "floral-notepaper_${RELEASE_VERSION}_msix.cer"
            "floral-notepaper_${RELEASE_VERSION}_amd64.deb"
            "floral-notepaper-${RELEASE_VERSION}-1.x86_64.rpm"
            "floral-notepaper_${RELEASE_VERSION}_amd64.AppImage"
            "floral-notepaper_${RELEASE_VERSION}_x64.dmg"
            "floral-notepaper_${RELEASE_VERSION}_aarch64.dmg"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done

          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$RELEASE_COMMIT"
            echo "workflow_run_id=$WORKFLOW_RUN_ID"
            echo "workflow_run_attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "source=rebuild"
          } > release-assets/BUILD-INFO.txt

          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' \
            > release-assets/SHA256SUMS.txt

      - name: Upload artifacts to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Summarize uploaded assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Rebuild upload summary ($RELEASE_TAG)"
            echo "- Uploaded $(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ') files with --clobber"
            echo "- Same-name assets replaced; missing assets added; unrelated existing assets kept"
            echo "- SHA256SUMS.txt and BUILD-INFO.txt refreshed (source=rebuild)"
            echo "- Release title/body/notes untouched"
          } >> "$GITHUB_STEP_SUMMARY"
