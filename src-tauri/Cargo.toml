[package]
name = "floral-notepaper"
version = "1.0.4"
description = "A lightweight cross-platform desktop note app"
authors = ["Achilng"]
edition = "2021"
default-run = "floral-notepaper"

[features]
default = []
floral-ai-addon = ["dep:rmcp", "dep:schemars", "dep:tokio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floral_notepaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "floral_cli_backend"
path = "src/addon/floral_cli_backend.rs"
required-features = ["floral-ai-addon"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-clipboard-manager = "2"
trash = "5"
fs2 = "0.4"
rmcp = { version = "1.7", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
], optional = true }
schemars = { version = "1", optional = true }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
rmcp = { version = "1.7", default-features = false, features = [
  "client",
  "transport-child-process",
] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
