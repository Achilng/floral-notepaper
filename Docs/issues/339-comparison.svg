  <rect x="404" y="615" width="392" height="36" rx="18" fill="#e5ece2"/>
  <text x="600" y="639" text-anchor="middle" fill="#467557" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">普通纯文本便签行为保持不变</text>
