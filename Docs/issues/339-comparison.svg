  </defs>
  <rect width="1200" height="680" fill="#f7f5ef"/>
  <text x="600" y="57" text-anchor="middle" fill="#292923" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="600">#339 便签图片显示修复对比</text>
  <text x="600" y="89" text-anchor="middle" fill="#79766d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">关闭“磁贴渲染 Markdown”时，粘贴的图片仍可正常显示</text>

  <text x="300" y="143" text-anchor="middle" fill="#9b4b46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">修复前</text>
  <text x="900" y="143" text-anchor="middle" fill="#467557" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">修复后</text>

  <g filter="url(#shadow)">
    <rect x="88" y="170" width="424" height="410" rx="4" fill="#fff6c9" stroke="#ddd19d"/>
    <path d="M103 192v-8h8 M489 184h8v8 M103 558v8h8 M489 566h8v-8" fill="none" stroke="#9c936d" opacity=".45"/>
