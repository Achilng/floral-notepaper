    <text x="120" y="274" fill="#5f5c50" font-family="Consolas, monospace" font-size="15">窗边的花开了，记录一下：</text>
    <rect x="116" y="302" width="366" height="42" rx="5" fill="#eee4ae" opacity=".8"/>
    <text x="130" y="329" fill="#716b53" font-family="Consolas, monospace" font-size="14">![](images/flower.png)</text>
    <text x="120" y="386" fill="#a05b55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">图片语法被当作纯文本显示</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="688" y="170" width="424" height="410" rx="4" fill="#fff6c9" stroke="#ddd19d"/>
    <path d="M703 192v-8h8 M1089 184h8v8 M703 558v8h8 M1089 566h8v-8" fill="none" stroke="#9c936d" opacity=".45"/>
    <text x="720" y="220" fill="#615c49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">今日随手记</text>
    <text x="720" y="274" fill="#5f5c50" font-family="Consolas, monospace" font-size="15">窗边的花开了，记录一下：</text>
    <rect x="760" y="302" width="280" height="210" rx="7" fill="url(#photo)"/>
    <path d="M807 512c36-82 74-119 124-166 M930 512c-9-72-5-119 31-166 M885 512c2-72-15-111-48-151" fill="none" stroke="#63825d" stroke-width="5" stroke-linecap="round"/>
